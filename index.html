<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSDC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<style>
  /* Mat design system (web): tokens and text styles from design-system web/mat.css */
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --label: #161616; --label-secondary: rgba(22, 22, 22, 0.64); --separator: rgba(22, 22, 22, 0.14);
    --font-sans: "Pretendard JP Variable", "Pretendard JP", "Pretendard Variable", Pretendard, system-ui, sans-serif;
    --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-44: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #242424; --label: #ebebeb; --label-secondary: rgba(235, 235, 235, 0.64); --separator: rgba(235, 235, 235, 0.14); }
  }
  body { margin: 0 auto; max-width: 720px; padding: var(--space-44) var(--space-20); background: var(--bg); color: var(--label);
         font-family: var(--font-sans); font-size: 1.0625rem; line-height: 1.375rem; letter-spacing: -0.0128em;
         -webkit-font-smoothing: antialiased; }
  h1 { font-size: 2.125rem; line-height: 2.5625rem; font-weight: 300; letter-spacing: -0.0218em; margin: 0 0 var(--space-8); }
  h2 { font-size: 1.375rem; line-height: 1.75rem; font-weight: 400; letter-spacing: -0.0183em;
       margin: var(--space-44) 0 var(--space-16); padding-bottom: var(--space-8); border-bottom: 0.5px solid var(--separator); }
  h3 { font-size: 1.0625rem; line-height: 1.375rem; font-weight: 500; letter-spacing: -0.0128em; margin: var(--space-24) 0 var(--space-8); }
  p { margin: var(--space-12) 0; }
  strong { font-weight: 500; }
  /* Pretendard JP has no italic face: emphasis is weight only */
  em { font-style: normal; font-weight: 500; }
  .muted { color: var(--label-secondary); font-size: 0.8125rem; line-height: 1.125rem; letter-spacing: -0.0032em; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.15em; }
  :focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }
  ul { padding-left: var(--space-20); margin: var(--space-12) 0; }
  li { margin: var(--space-4) 0; }
</style>
</head>
<body>
  <h1>QSDC</h1>
  <p class="muted">SD-card photo culling &amp; viewer for iPhone and iPad.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy / 개인정보 처리방침 / プライバシー</a></li>
    <li><a href="support.html">Support / 지원 / サポート</a></li>
  </ul>
</body>
</html>
